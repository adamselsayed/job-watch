# Companies to watch. One block per company.
#
#   name:  how the company appears on the dashboard
#   ats:   greenhouse | lever | ashby | smartrecruiters | workday   (the job-board system the company uses)
#   board: the company's board token (the slug in its job-board URL)
#   url:   the public careers page (for reference / linking)
#
# Finding the board token:
#   Greenhouse: careers page loads from boards.greenhouse.io/<token>  or  job-boards.greenhouse.io/<token>
#   Lever:      jobs.lever.co/<token>
#   Ashby:      jobs.ashbyhq.com/<token>
#   SmartRecruiters: jobs.smartrecruiters.com/<token>/...  or the company identifier in api.smartrecruiters.com/v1/companies/<token>/postings
#   Workday:    <tenant>.<wd#>.myworkdayjobs.com/<site>  ->  board: <tenant>.<wd#>/<site>   (e.g. hitachi.wd1/hitachi)
#               optional  filter: Name A, Name B   keeps only postings whose hiring organization / description mentions one of these
#               optional  scan: all                 page through the whole board instead of Workday's keyword search
#
# After adding a company, run:  python3 scripts/fetch_jobs.py
# (GitHub Actions also runs it automatically every morning.)

- name: Samsara
  ats: greenhouse
  board: samsara
  url: https://www.samsara.com/company/careers/roles

- name: Motive
  ats: greenhouse
  board: gomotive
  url: https://gomotive.com/company/careers/jobs/

- name: Toast
  ats: greenhouse
  board: toast
  url: https://careers.toasttab.com/jobs/search

- name: Experian
  ats: smartrecruiters
  board: Experian
  url: https://jobs.experian.com/jobs

- name: Komodo Health
  ats: greenhouse
  board: komodohealth
  url: https://job-boards.greenhouse.io/komodohealth

- name: ServiceNow
  ats: smartrecruiters
  board: ServiceNow
  url: https://careers.servicenow.com/

- name: Thumbtack
  ats: ashby
  board: thumbtack
  url: https://careers.thumbtack.com/jobs

- name: ChargePoint
  ats: greenhouse
  board: chargepoint
  url: https://www.chargepoint.com/about/opportunities

- name: Life360
  ats: greenhouse
  board: life360
  url: https://www.life360.com/open-positions

- name: Hitachi
  ats: workday
  board: hitachi.wd1/hitachi
  filter: Hitachi Vantara, Hitachi Digital Services
  scan: all          # group-wide board: scan every posting rather than relying on Workday's search
  url: https://www.hitachivantara.com/en-us/company/careers/job-search

- name: Smartsheet
  ats: greenhouse
  board: smartsheet
  url: https://www.smartsheet.com/careers-list
