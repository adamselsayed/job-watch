# Companies to watch. One block per company.
#
#   name:  how the company appears on the dashboard
#   ats:   greenhouse | lever | ashby | smartrecruiters | workday | phenom | jobvite | rippling | bamboohr | workable | avature | manual | jibe | oracle | talentbrew   (the job-board system the company uses)
#   board: the company's board token (the slug in its job-board URL)
#   url:   the public careers page (for reference / linking)
#   country: US   (optional) treat locations with no country stated (e.g. "Remote") as US for this company
#   exclude: word, word   (optional) extra standalone title words to drop for this company only (e.g. retail "Product Guide" roles)
#
# Finding the board token:
#   Greenhouse: careers page loads from boards.greenhouse.io/<token>  or  job-boards.greenhouse.io/<token>
#   Lever:      jobs.lever.co/<token>
#   Ashby:      jobs.ashbyhq.com/<token>
#   SmartRecruiters: jobs.smartrecruiters.com/<token>/...  or the company identifier in api.smartrecruiters.com/v1/companies/<token>/postings
#   Workday:    <tenant>.<wd#>.myworkdayjobs.com/<site>  ->  board: <tenant>.<wd#>/<site>   (e.g. hitachi.wd1/hitachi)
#               optional  filter: Name A, Name B   keeps only postings whose hiring organization / description mentions one of these
#               optional  scan: all                 page through the whole board instead of Workday's keyword search
#               optional  facets: key=id,id; key2=id  Workday facet filters (ids come from the board's /jobs response)
#   Phenom:     careers site with URLs like <host>/global/en/search-results  ->  board: <host>/global/en
#   Jobvite:    jobs.jobvite.com/<token>/jobs  ->  board: <token>
#   Rippling:   ats.rippling.com/<token>/jobs  ->  board: <token>
#   BambooHR:   <token>.bamboohr.com/careers  ->  board: <token>
#   Workable:   apply.workable.com/<token>/  ->  board: <token>
#   Avature:    <host>/<locale>/<portal>/SearchJobs  ->  board: <host>/<locale>/<portal>   (e.g. jobs.siemens.com/en_US/externaljobs)
#   manual:     boards that block automated reads (Dayforce, FedEx's Paradox site). Not fetched; listed under
#               "Manual Pulls Only" in the sidebar with a link to the careers page.
#   Jibe/iCIMS: <host>/careers-home/jobs  ->  board: <host>   (e.g. careers.rivian.com)
#   Oracle Recruiting: <host>/en/sites/<site>/...  ->  board: <host>/<site>   (must be Oracle's own fa-*.oraclecloud.com host)
#               optional  link: job URL template with {id}, for companies that front Oracle with their own domain
#   Paradox: careers.<co>.com/jobs (cdn.sites.paradox.ai)  ->  board: <host>   (optional sources: substrings of the feed's company/brand)
#   also_ats / also_board / also_<key>: one extra board whose jobs are shown under the same company
#   TalentBrew/Radancy: <host>/<lang>/search-jobs  ->  board: <host>/<lang>   (e.g. www.careers.ford.com/en; just <host> if there is no language segment, e.g. jobs.intuit.com)
#
# After adding a company, run:  python3 scripts/fetch_jobs.py
# (GitHub Actions also runs it automatically every morning.)

