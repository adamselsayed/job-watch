name: Probe careers page (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          cat > p.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const pg = await b.newPage();
            pg.on('request', r => { const u = r.url(); if (/hcmRestApi|recruiting|oraclecloud/i.test(u)) console.log('REQ', r.method(), u.slice(0, 400)); });
            pg.on('framenavigated', f => console.log('NAV', f.url().slice(0, 300)));
            await pg.goto('https://jobs.hertzcareers.com/#en/sites/CX_1/jobs', { waitUntil: 'networkidle', timeout: 90000 }).catch(e => console.log('GOTOERR', e.message));
            await pg.waitForTimeout(6000);
            console.log('FINAL', pg.url());
            await b.close();
          })();
          JS
          node p.js
