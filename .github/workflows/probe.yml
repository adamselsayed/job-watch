name: Probe careers page (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          cat > p.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const pg = await b.newPage();
            pg.on('request', r => { if (r.url().includes('/api/get-jobs')) console.log('REQ', r.url(), '\n BODY', (r.postData() || '').slice(0, 1500), '\n HDR', JSON.stringify(r.headers())); });
            pg.on('response', async r => { if (r.url().includes('/api/get-jobs')) { const j = await r.json().catch(() => null); if (j) { console.log('KEYS', Object.keys(j), 'n', (j.jobs || []).length, JSON.stringify(Object.fromEntries(Object.entries(j).filter(([k]) => k !== 'jobs'))).slice(0, 800)); const x = (j.jobs || [])[0]; if (x) console.log('JOBKEYS', JSON.stringify(Object.fromEntries(Object.entries(x).map(([k, v]) => [k, typeof v === 'string' ? v.slice(0, 80) : v]))).slice(0, 2500)); } } });
            await pg.goto('https://careers.hitachi.com/jobs?keyword=product%20manager', { waitUntil: 'networkidle', timeout: 90000 }).catch(e => console.log('ERR', e.message));
            await pg.waitForTimeout(3000);
            const nxt = await pg.$('a[href*="/jobs/page/2"]'); if (nxt) { await nxt.click(); await pg.waitForTimeout(5000); }
            await b.close();
          })();
          JS
          node p.js
