name: Probe careers page (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          cat > p.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const pg = await b.newPage();
            pg.on('request', r => { const u = r.url(); if (!/\.(png|jpe?g|svg|woff2?|css|gif|webp|ico)(\?|$)/.test(u) && !/google|facebook|hotjar|segment|hubspot|linkedin|doubleclick/.test(u)) console.log('REQ', r.method(), u.slice(0, 250)); });
            await pg.goto('https://www.fieldai.com/careers', { waitUntil: 'networkidle', timeout: 60000 });
            await pg.waitForTimeout(4000);
            const links = await pg.$$eval('a', as => as.map(a => a.href).filter(h => /job|career|apply|greenhouse|lever|ashby|rippling|workable/i.test(h)));
            console.log('LINKS', JSON.stringify([...new Set(links)].slice(0, 40)));
            await b.close();
          })();
          JS
          node p.js
