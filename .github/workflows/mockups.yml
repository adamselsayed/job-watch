name: Design mockups
on:
  push:
    branches: [design-mockups]
    paths-ignore: ['shots/**']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: (python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 1 && node scripts/mockups.js
      - run: |
          rm -rf node_modules package*.json
          git config user.name "job-watch bot"; git config user.email "actions@users.noreply.github.com"
          git add shots && git commit -m "Mockup screenshots" && git push
